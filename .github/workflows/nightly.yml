name: nightly-builds

on:
  schedule:
    - cron: '0 8 * * *'   # nightly, 08:00 UTC
  
env:
  REGISTRY: ghcr.io

jobs:
  build-containers:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: ./install.sh

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Kolla Build
        env:
          BUILD_TAG: 2023.1-ubuntu-jammy-nightly
          PUSH: true
        run: |
          ./run.sh \
          --work-dir $RUNNER_TEMP \
          --threads $(nproc)
