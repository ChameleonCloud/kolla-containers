name: kolla-build-matrix
on:
  schedule:
    - cron: "0 4 * * *"
      timezone: "America/Chicago"
  push:
    branches:
      - 'chameleoncloud/2025.1**'

env:
  REGISTRY: ghcr.io

jobs:
  build_matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - base_tag: "24.04"
            tag: "2025.1-ubuntu-noble"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install \
            src/kolla \
            docker

      - name: Run Kolla Build
        env:
          BASE_TAG: ${{matrix.base_tag}}
          BUILD_TAG: ${{ matrix.tag }}
        run: |
          ./run.sh \
          --work-dir $RUNNER_TEMP \
          --threads $(nproc)
